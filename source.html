<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Source - Campus Nexus</title>
<meta name="description" content="Every source file of Campus Nexus, readable in the browser. No clone required.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237c5cff'/%3E%3Cg fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M25 42 50 27l25 15-25 15-25-15Z'/%3E%3Cpath d='M33 50v18c0 5 8 9 17 9s17-4 17-9V50'/%3E%3C/g%3E%3C/svg%3E">

<style>
:root{
  --bg:#070910;--bg2:#0c0f1a;--surface:#111527;--surface2:#161a2e;
  --border:#232a45;--border2:#2e3757;
  --fg:#e9edf7;--fg2:#c3cade;--dim:#8b95b5;--faint:#616c8c;
  --accent:#7c5cff;--accent2:#3b82f6;--accent3:#06b6d4;
  --ok:#10b981;--warn:#f59e0b;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;--r-sm:9px;
}
[data-theme="light"]{
  --bg:#f6f7fb;--bg2:#eef0f8;--surface:#fff;--surface2:#f4f6fc;
  --border:#dfe3ef;--border2:#cdd4e6;
  --fg:#131725;--fg2:#333c58;--dim:#5a6486;--faint:#8791b0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  display:flex;flex-direction:column;
  background-image:radial-gradient(900px 420px at 10% -10%,rgba(124,92,255,.15),transparent 60%);
  background-attachment:fixed;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---- bar ---- */
.bar{
  display:flex;align-items:center;gap:14px;padding:12px 20px;flex:none;
  border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:20
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px;color:var(--fg);white-space:nowrap}
.brand svg{width:27px;height:27px;border-radius:7px;flex:none}
.crumb{
  color:var(--faint);font-family:var(--mono);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0
}
.bar .spacer{margin-left:auto}
.gh{
  display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:9px;
  border:1px solid var(--border2);background:var(--surface);color:var(--fg);
  font-size:13px;font-weight:600;white-space:nowrap
}
.gh:hover{border-color:var(--accent);text-decoration:none}
.tb{
  width:33px;height:33px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;flex:none
}
.tb:hover{border-color:var(--accent)}

/* ---- body ---- */
.body{display:flex;flex:1;min-height:0}
.tree{
  width:330px;flex:none;border-right:1px solid var(--border);
  overflow-y:auto;padding:12px 8px 40px;background:var(--bg2)
}
.tree .grp{
  font-size:10.5px;font-weight:700;letter-spacing:1.1px;color:var(--faint);
  padding:12px 12px 7px;text-transform:uppercase
}
.tree button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:6px 12px;border:0;background:none;color:var(--fg2);
  font-family:var(--mono);font-size:12.4px;border-radius:7px;cursor:pointer
}
.tree button:hover{background:var(--surface);color:var(--fg)}
.tree button.on{background:var(--surface2);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.tree button .sz{margin-left:auto;font-size:10.5px;color:var(--faint);flex:none}
.tree button .dot{width:7px;height:7px;border-radius:2px;flex:none}
.search{
  margin:0 8px 8px;padding:8px 11px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);font-family:var(--mono);font-size:12.5px;width:calc(100% - 16px)
}
.search:focus{outline:none;border-color:var(--accent)}

/* ---- reader ---- */
.reader{flex:1;overflow:auto;min-width:0}
.meta{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.meta h1{margin:0;font-size:15px;font-family:var(--mono);font-weight:700}
.meta .sub{color:var(--faint);font-size:12.5px;font-family:var(--mono)}
.code{
  margin:0;padding:16px 0 60px;font-family:var(--mono);font-size:12.7px;
  line-height:1.7;tab-size:2
}
.ln{display:flex}
.ln:hover{background:rgba(124,92,255,.07)}
.ln .no{
  width:60px;flex:none;text-align:right;padding-right:16px;color:var(--faint);
  user-select:none;-webkit-user-select:none
}
.ln .tx{padding-right:22px;white-space:pre;overflow-wrap:normal}
.placeholder{padding:70px 30px;text-align:center;color:var(--faint)}
.placeholder h2{color:var(--fg);font-size:19px;margin:0 0 10px}
.k{color:#c4a5ff}.s{color:#7ee3b8}.c{color:#5b6480;font-style:italic}.n{color:#f0b47a}
.p{color:#6ee7b7}.t{color:#6ee7b7}.f{color:#8fc0ff}

@media (max-width:820px){
  .body{flex-direction:column}
  .tree{width:100%;max-height:38vh;border-right:0;border-bottom:1px solid var(--border)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="bar">
  <a class="brand" href="./">
    <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#7c5cff"/><g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M25 42 50 27l25 15-25 15-25-15Z"/><path d="M33 50v18c0 5 8 9 17 9s17-4 17-9V50"/></g></svg>
    <span>Campus Nexus</span>
  </a>
  <span class="crumb" id="crumb">source</span>
  <span class="spacer"></span>
  <a class="gh" href="https://github.com/Abhijeet-Kumar-Prajapati/Campus-Nexus" target="_blank" rel="noopener noreferrer">Open on GitHub</a>
  <button class="tb" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
</div>

<div class="body">
  <nav class="tree">
    <input class="search" id="q" type="search" placeholder="filter files" aria-label="Filter files" spellcheck="false">
    <div id="list"></div>
  </nav>
  <main class="reader">
    <div class="meta" id="meta" hidden>
      <h1 id="mName"></h1>
      <span class="sub" id="mSub"></span>
    </div>
    <pre class="code" id="code"></pre>
    <div class="placeholder" id="ph">
      <h2>Pick a file</h2>
      <p>Every source file in this repository, served straight from the deployment.<br>
         Nothing is copied here &mdash; what you read is what <code>git clone</code> gives you.</p>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  const EXT_COLOUR = {
    js: "#f0b47a", json: "#6ee7b7", sql: "#8fc0ff", md: "#c4a5ff",
    css: "#6ee7b7", html: "#f0b47a", yaml: "#c4a5ff", bat: "#8fc0ff",
  };

  let FILES = [];
  let current = null;

  /* ------------------------------------------------------------ theme -- */
  const root = document.documentElement;
  const tb = document.getElementById("themeBtn");
  const paint = () => {
    const dark = root.getAttribute("data-theme") !== "light";
    tb.innerHTML = dark
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a7 7 0 0 0 10.8 10.8Z"/></svg>';
  };
  try { const s = localStorage.getItem("cnx-site-theme"); if (s) root.setAttribute("data-theme", s); } catch (e) {}
  paint();
  tb.addEventListener("click", () => {
    const n = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", n);
    try { localStorage.setItem("cnx-site-theme", n); } catch (e) {}
    paint();
  });

  /* ------------------------------------------------------ highlight ---- */
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* Escapes first, then wraps. Each pass skips the spans already emitted so
     a keyword inside a string is not coloured twice. */
  function highlight(line, ext) {
    let s = esc(line);
    const holes = [];
    const hold = (cls, text) => {
      holes.push('<span class="' + cls + '">' + text + "</span>");
      return "␀" + (holes.length - 1) + "␀";
    };

    if (ext === "js") {
      s = s.replace(/(&#39;(?:\\.|[^&\\]|&(?!#39;))*&#39;)|("(?:\\.|[^"\\])*")/g,
        (m) => hold("s", m));
      s = s.replace(/\/\/[^\n]*/g, (m) => hold("c", m));
      s = s.replace(/\b(const|let|var|function|return|if|else|for|of|in|while|await|async|new|class|extends|throw|try|catch|finally|typeof|instanceof|import|export|from|default|break|continue|switch|case|null|undefined|true|false|this|yield|static|get|set)\b/g,
        (m) => hold("k", m));
      s = s.replace(/\b([A-Z][A-Za-z0-9_]*)\b/g, (m) => hold("f", m));
    } else if (ext === "sql") {
      s = s.replace(/(&#39;(?:\\.|[^&\\]|&(?!#39;))*&#39;)|("(?:\\.|[^"\\])*")/g, (m) => hold("s", m));
      s = s.replace(/(--[^\n]*)/g, (m) => hold("c", m));
      s = s.replace(/\b(SELECT|INSERT|UPDATE|DELETE|CREATE|TABLE|INDEX|UNIQUE|PRIMARY|FOREIGN|KEY|REFERENCES|WHERE|FROM|SET|VALUES|AND|OR|NOT|NULL|DEFAULT|CHECK|INTEGER|TEXT|REAL|BLOB|VARCHAR|DATETIME|GLOB|LIKE|BEGIN|COMMIT|TRIGGER|EXISTS|CASE|WHEN|THEN|END)\b/gi,
        (m) => hold("k", m));
    } else if (ext === "md") {
      s = s.replace(/^(#{1,6}\s.*)$/m, (m) => hold("k", m));
      s = s.replace(/(&#96;&#96;?)(?:(?!\1).)*\1/g, (m) => hold("s", m));
      s = s.replace(/\*\*[^*]+\*\*/g, (m) => hold("f", m));
    } else if (ext === "json") {
      s = s.replace(/("(?:\\.|[^"\\])*")(\s*:)/g, (m, a, b) => hold("f", a) + b);
      s = s.replace(/\b(-?\d+(?:\.\d+)?)\b/g, (m) => hold("n", m));
    } else if (ext === "css") {
      s = s.replace(/(\/\*[\s\S]*?\*\/)/g, (m) => hold("c", m));
      s = s.replace(/([.#][A-Za-z0-9_-]+)/g, (m) => hold("f", m));
    } else if (ext === "html") {
      s = s.replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9]*)/g, (m, a, b) => a + hold("k", b));
      s = s.replace(/(&#39;(?:\\.|[^&\\]|&(?!#39;))*&#39;)|("(?:\\.|[^"\\])*")/g, (m) => hold("s", m));
    } else if (ext === "yaml" || ext === "yml") {
      s = s.replace(/(#[^\n]*)/g, (m) => hold("c", m));
      s = s.replace(/^(\s*)([\w.-]+)(:)/gm, (m, a, b, c) => a + hold("f", b) + c);
    }

    return s.replace(/␀(\d+)␀/g, (_, i) => holes[Number(i)]);
  }

  /* ----------------------------------------------------------- tree --- */
  function groupOf(p) {
    const parts = p.split("/");
    if (parts.length === 1) return "root";
    if (parts[0] === "src" && parts[1] === "security") return "src / security";
    if (parts[0] === "src" && parts[1] === "routes") return "src / routes";
    if (parts[0] === "public" && parts[1] === "js") return "public / js";
    if (parts[0] === "public" && parts[1] === "css") return "public / css";
    if (parts[0] === "public" && parts[1] === "dist") return "public / dist";
    if (parts[0] === "scripts") return "scripts";
    if (parts[0] === "site-demo") return "site demo";
    return parts[0];
  }

  const ORDER = ["root", "src", "src / routes", "src / security", "server", "scripts",
                 "public", "public / css", "public / js", "public / dist",
                 "site demo", "site-images", "SECURITY", ".github"];

  function renderTree(filter) {
    const list = document.getElementById("list");
    list.innerHTML = "";
    const needle = (filter || "").trim().toLowerCase();
    const rows = FILES.filter((f) => !needle || f.path.toLowerCase().includes(needle));

    if (!rows.length) {
      list.innerHTML = '<div style="padding:16px 12px;color:var(--faint);font-size:12.5px">No file matches that.</div>';
      return;
    }

    const groups = new Map();
    for (const f of rows) {
      const g = groupOf(f.path);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(f);
    }

    const names = [...groups.keys()].sort(
      (a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b)
    );

    for (const g of names) {
      const h = document.createElement("div");
      h.className = "grp";
      h.textContent = g;
      list.appendChild(h);
      for (const f of groups.get(g)) {
        const b = document.createElement("button");
        b.type = "button";
        if (current === f.path) b.className = "on";
        b.dataset.path = f.path;
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = EXT_COLOUR[f.ext] || "var(--faint)";
        const name = document.createElement("span");
        name.textContent = f.path.split("/").pop();
        const sz = document.createElement("span");
        sz.className = "sz";
        sz.textContent = f.bytes > 1024 ? (f.bytes / 1024).toFixed(1) + "k" : f.bytes;
        b.append(dot, name, sz);
        b.addEventListener("click", () => open(f.path));
        list.appendChild(b);
      }
    }
  }

  /* ---------------------------------------------------------- reader -- */
  async function open(path) {
    current = path;
    document.getElementById("crumb").textContent = path;
    document.getElementById("ph").hidden = true;
    const meta = document.getElementById("meta");
    const code = document.getElementById("code");
    meta.hidden = false;
    code.innerHTML = '<div style="padding:20px 22px;color:var(--faint)">loading…</div>';
    document.querySelectorAll(".tree button").forEach((b) =>
      b.classList.toggle("on", b.dataset.path === path));

    let text = "";
    try {
      const res = await fetch("./" + path);
      if (!res.ok) throw new Error("HTTP " + res.status);
      text = await res.text();
    } catch (e) {
      code.innerHTML = "";
      code.appendChild(Object.assign(document.createElement("div"),
        { className: "placeholder", textContent: "Could not load " + path + " — " + e.message }));
      return;
    }

    const f = FILES.find((x) => x.path === path) || { ext: "", bytes: 0 };
    document.getElementById("mName").textContent = path.split("/").pop();
    document.getElementById("mSub").textContent =
      (f.bytes ? (f.bytes / 1024).toFixed(1) + " KB" : "") +
      (f.ext ? "  ·  " + f.ext.toUpperCase() : "");

    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const frag = document.createDocumentFragment();
    lines.forEach((line, i) => {
      const row = document.createElement("div");
      row.className = "ln";
      const no = document.createElement("span");
      no.className = "no";
      no.textContent = String(i + 1);
      const tx = document.createElement("span");
      tx.className = "tx";
      tx.innerHTML = highlight(line, f.ext);
      row.append(no, tx);
      frag.appendChild(row);
    });
    code.innerHTML = "";
    code.appendChild(frag);
  }

  /* ------------------------------------------------------------ boot -- */
  (async function boot() {
    let files = [];
    try {
      const res = await fetch("./source-files.json");
      if (!res.ok) throw new Error("HTTP " + res.status);
      files = await res.json();
    } catch (e) {
      document.getElementById("list").innerHTML =
        '<div style="padding:16px 12px;color:var(--warn);font-size:12.5px">' +
        "source-files.json did not load (" + e.message + ")</div>";
      return;
    }
    FILES = files.map((f) => ({
      ...f,
      // source-files.json carries path.extname(), which keeps the dot (".js").
      // Everything below keys on a bare extension, so it is normalised once
      // here rather than stripped in four places.
      ext: String(f.ext || "").replace(/^\./, "").toLowerCase(),
    }));
    renderTree("");
    document.getElementById("q").addEventListener("input", (e) => renderTree(e.target.value));

    // A deep link such as source.html#src/routes/store.routes.js opens that file.
    const want = decodeURIComponent(location.hash.slice(1));
    open(FILES.some((f) => f.path === want) ? want : "server.js");
  })();

  window.addEventListener("hashchange", () => {
    const want = decodeURIComponent(location.hash.slice(1));
    if (want && want !== current && FILES.some((f) => f.path === want)) open(want);
  });
})();
</script>
</body>
</html>
